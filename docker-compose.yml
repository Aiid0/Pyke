# Windows（Docker Desktop）用户请加 -f docker-compose.windows.yml 启动：
#   docker compose -f docker-compose.yml -f docker-compose.windows.yml up -d
# 它把 data/ 换成 named volume（NTFS bind mount 的小文件 I/O 实测慢约
# 两个数量级，流量/证据写入会明显变卡），并放开回连端口映射。
# 详见 docker-compose.windows.yml 头注释与 docs/部署手册.md 的 Windows 章节。

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pyke}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pyke}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pyke} -d ${POSTGRES_DB:-pyke}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  pyke:
    # 镜像在 GHCR 与 Docker Hub 双源发布；默认走 GHCR（发布工作流必然推送），
    # 需要换源时用 PYKE_IMAGE 覆盖。
    image: ${PYKE_IMAGE:-ghcr.io/aiid0/pyke}:${PYKE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      # 容器通过此别名访问本机代理等宿主服务（兼容 Linux Docker）。
      - "host.docker.internal:host-gateway"
    environment:
      # v0.5.0 更名说明：PG 角色/库名默认 pyke；存量部署（仍是 pojun）用 .env 固定 POSTGRES_USER/POSTGRES_DB 或按 CHANGELOG 执行改名
      PYKE_PG_DSN: postgres://${POSTGRES_USER:-pyke}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pyke}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PYKE_LLM_PROVIDER: ${PYKE_LLM_PROVIDER:-${POJUN_LLM_PROVIDER:-}}
      PYKE_LLM_MODEL: ${PYKE_LLM_MODEL:-${POJUN_LLM_MODEL:-}}
      PYKE_LLM_BASE_URL: ${PYKE_LLM_BASE_URL:-${POJUN_LLM_BASE_URL:-}}
      PYKE_LLM_PROXY: ${PYKE_LLM_PROXY:-${POJUN_LLM_PROXY:-}}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
      # 回连端口映射(按需放开):容器内 MSF/listener 监听的端口要映射到宿主,
      # agent 才能收到 reverse shell。示例(解除注释并按需改):
      # - "4444-4450:4444-4450"
    volumes:
      # 把数据目录（含 jwt.key、SQLite 等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ./data:/app/data
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
